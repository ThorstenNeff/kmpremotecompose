# RC Interaction Harness — REM-108 S2: Click → Callback-Echo (PREBUILD / STAGED)
# Owner: test-1 (QA). Player-impl: dev-1 (REM-108 S2 Click-Exekution, Option B). Epic: REM-154.
# Contract: docs/TECHSPEC-REM-108-interaction-api.md @d7ed33d (v1.1). Concretized against it 2026-06-30.
#
# STATUS: 🟡 STAGED PREBUILD — authored against the assist contract BEFORE dev-1 ships S0→S2. DO NOT run as
#   a gate yet; the `staged` tag holds it out of the green sweep until S2 (click execution) + the
#   `rc-action-echo` hook land. The causal gate (commented PENDING) is what S2 delivers.
#
# WHAT IT GATES (once live): a click on an identified element executes its in-doc action AND surfaces it.
#   Per contract §4: tap → hit-test → Option-B dispatch-walk fires the ActionOperations → the in-doc
#   VALUE_INTEGER_CHANGE_ACTION mutates DATA_INT(id=42) + onClick(RcClickEvent) emits + rc-action-echo updates.
#   Corpus fixtures (TECHSPEC-REM-G1 §1):
#     c_modifier_on_touch_down   → DOWN   handler → 42 := 2   (label "Press Down",   blue bg)
#     c_modifier_on_touch_up     → UP     handler → 42 := 3   (label "Release Up",   green bg)
#     c_modifier_on_touch_cancel → CANCEL handler → 42 := 4   (label "Touch Cancel", grey bg)
#
# 🔑 GESTURE = tapOn (NOT swipe). Contract §3/§7-S2 pin Click = CMP `detectTapGestures` — a SEPARATE detector
#   from the drag path. ✅ This answers the dispatch-path question I flagged.
#
# 🧪 EMPIRICAL PROBE (test-1, 2026-06-30, pre-S2 build @3c2ff54 — verify-before-route): a `tapOn` does NOT
#   move `rc-touch-echo` today (measured: echo stays "0,0" after the tap). Reason: TouchState is fed ONLY by
#   the wired `detectDragGestures`; the tap detector is unbuilt S2 work. ⇒ there is NO today-co-signal for
#   the click path — render + no-crash are the ONLY today-green assertions; the input+causal proof is
#   genuinely PENDING on S2. (This is exactly WHY `rc-action-echo` is a first-class contract deliverable §5.)
#
# 🔴 CAUSAL OBSERVABLE = `rc-action-echo` (contract §5): surfaces the click-mutated DATA_INT(id=42). The
#   rendered text stays the static label, so the echo is the ONLY observation path. Format = `"<valueId>=<value>"`
#   (e.g. "42=2") — ✅ PO-LOCKED 2026-06-30 (Contract §4-Q2; relayed to dev-1 for S0/S2). The PENDING asserts
#   below are pinned to it → activation at S2-land is uncomment + drop `staged`, no guesswork.
#
# Run (after S2 + rc-action-echo land, drop `staged` + uncomment the causal blocks):
#   ~/.maestro/bin/maestro --device emulator-5554 test docs/flows/interaction_click_callback.yaml

appId: com.tneff.kmpremotecompose.android
name: "REM-108 S2 click->callback-echo (STAGED prebuild)"
tags:
  - interaction
  - touch
  - callback
  - staged          # ← remove when S2 + rc-action-echo land → promotes to gating
---
- launchApp:
    clearState: true
# PARAMETERIZE per fixture: down→"42=2", up→"42=3", cancel→"42=4". Shown for on_touch_down.
- openLink:
    link: "kmprc://render?rc=c_modifier_on_touch_down&live=1"
    autoVerify: true
- assertVisible:
    id: "rc-canvas"
- extendedWaitUntil:
    visible:
      id: "rc-rendered"
    timeout: 10000
    label: "doc committed a frame (post-frame-commit honesty anchor)"
- assertNotVisible:
    id: "rc-error"
- assertVisible:
    id: "rc-doc"
    text: "c_modifier_on_touch_down"
    label: "gerendertes Doc == Ziel (kein Resource-Fallback)"
- assertVisible:
    id: "rc-draw-count"
    text: "^[1-9][0-9]*$"
    label: "doc nicht blank"

# ── PENDING (needs rc-action-echo, S0): pre-click sentinel — DATA_INT(42) at init (expect "42=0") ──
#- copyTextFrom:
#    id: "rc-action-echo"
#- evalScript: ${output.act0 = maestro.copiedText}

# ── CLICK: tapOn (contract §3 = detectTapGestures; NOT a swipe). on_touch_down doc has only the DOWN ──
#    handler → 42:=2. (up/cancel fixtures: see §4 active-touch-span routing — up/cancel must route to the
#    DOWN span, not a re-hit-test; the cancel fixture exercises a started-then-cancelled gesture.)
- tapOn:
    id: "rc-canvas"
    label: "click → Option-B dispatch-walk runs the touch-event action"

# ── Liveness / no-crash after the click (TODAY-GREEN scope) ──
- assertNotVisible:
    id: "rc-error"
    label: "Click hat den Render-Pfad NICHT gecrasht"
- assertVisible:
    id: "rc-rendered"
    label: "Render committet weiter nach dem Click"

# NOTE: NO rc-touch-echo co-signal here — empirically a tap does not feed TouchState pre-S2 (probe above).
#       The input+causal proof arrives entirely via rc-action-echo once S2 wires detectTapGestures.

# ── PENDING CAUSAL GATE (needs S2 + rc-action-echo): action FIRED → DATA_INT(42) reached the Soll-Wert ──
#- copyTextFrom:
#    id: "rc-action-echo"
#- evalScript: ${output.act1 = maestro.copiedText}
#- assertTrue:
#    condition: ${output.act1 != output.act0 && output.act1 == "42=2"}   # up→"42=3", cancel→"42=4"
#    label: "Click fired → VALUE_INTEGER_CHANGE_ACTION mutierte DATA_INT(42) auf den Soll-Wert + onClick (KAUSAL)"

# ── PENDING DETERMINISM PIN (§5 leitplanke 1): &live=0 → no dispatch → rc-action-echo stays "42=0" ──
#   (Floor-Target liefert keinen Echo → das Gate degradiert sauber statt hart zu failen; §0/§2 immune.)

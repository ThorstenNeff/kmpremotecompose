# RC Interaction Harness — REM-108 S1: Drag → Scroll-Offset (PREBUILD / STAGED)
# Owner: test-1 (QA). Player-impl: dev-2 (REM-108 S1 Scroll-Observability; ScrollModifier render already
#   merged @071148a/S3b). Epic: REM-154. Contract: docs/TECHSPEC-REM-108-interaction-api.md @d7ed33d (v1.1).
#
# STATUS: 🟡 STAGED PREBUILD — authored against the assist contract for a CLEAN, hook-driven scroll gate.
#   NOTE: the Drag→TouchExpression→Store→scrollOffset→Clip+Translate path is ALREADY closed on develop
#   (contract §1) and I gave the render a visual GO in S3b (clip-window-mad 12.08, live-gated 0.000 — see
#   NOTES). This harness ADDS the contract's `onScroll`/`rc-scroll-offset` non-visual, W9-safe causal gate
#   over the ALREADY-computed offset (S1 = read-only observability, low risk). DO NOT run as the offset-gate
#   until `rc-scroll-offset` lands; the `staged` tag holds it out of the green sweep.
#
# WHAT IT GATES (once live): a drag advances the ScrollModifier offset, surfaced + live-gated.
#   Contract §4: onScroll(RcScrollEvent(componentId, offset, axis)) — offset = ScrollModifier.scrollOffset
#   (clamped, signed; axis VERTICAL=0/HORIZONTAL=1). Doc: c_modifier_vertical_scroll — grey clip-window,
#   Items 1..N taller than the viewport; a vertical drag translates the content within the fixed clip-window
#   (S3b proof: Item3 clipped top / Item15 clipped bottom while the grey window stays fixed).
#
# 🔴 OBSERVABILITY: causal signal = `rc-scroll-offset` (contract §5) surfacing the live signed scrollOffset
#   (sentinel "0.0", non-zero after drag, "0.0" in static). Spec: REM-108-interaction-harness-hooks.md.
#   WORKING-TODAY FALLBACK explicitly endorsed by contract §5 ("zweiter, render-basierter Verify-Pfad"):
#   the S3b visual clip-window-mad method — capture rc-canvas crop rest/after, assert mad above the W9 noise
#   floor (out-of-Maestro, capgold.py-style). Maestro can't pixel-diff → the in-flow causal gate stays
#   PENDING on the hook; the in-flow today-part is liveness + the input-co-signal (verified green 2026-06-30).
#
# 🔑 WIRING (verified in S3b): live-only (`touchState = if(live) touchState else null`); gesture-seam =
#   detectDragGestures → MUST cross touch-slop → use `swipe` with real travel + duration, NOT tapOn, NOT
#   adb input swipe (echo stays "0,0"). rc-touch-echo EXISTS today = input-accepted co-signal.
#
# Run (after rc-scroll-offset lands, drop `staged`):
#   ~/.maestro/bin/maestro --device emulator-5554 test docs/flows/interaction_drag_scroll.yaml

appId: com.tneff.kmpremotecompose.android
name: "REM-108 S3b drag->scroll-offset (STAGED prebuild)"
tags:
  - interaction
  - touch
  - scroll
  - staged          # ← remove when rc-scroll-offset lands → promotes to gating
---
- launchApp:
    clearState: true
- openLink:
    link: "kmprc://render?rc=c_modifier_vertical_scroll&live=1"
    autoVerify: true
- assertVisible:
    id: "rc-canvas"
- extendedWaitUntil:
    visible:
      id: "rc-rendered"
    timeout: 10000
    label: "scroll doc committed a frame"
- assertNotVisible:
    id: "rc-error"
- assertVisible:
    id: "rc-doc"
    text: "c_modifier_vertical_scroll"
- assertVisible:
    id: "rc-draw-count"
    text: "^[1-9][0-9]*$"
    label: "scroll content not blank"

# ── PENDING (needs rc-scroll-offset): pre-drag sentinel — offset at rest (expect "0.0") ──
#- copyTextFrom:
#    id: "rc-scroll-offset"
#- evalScript: ${output.off0 = maestro.copiedText}

# ── PRE-drag co-signal that EXISTS today: rc-touch-echo sentinel "0,0" ──
- copyTextFrom:
    id: "rc-touch-echo"
- evalScript: ${output.echo0 = maestro.copiedText}

# ── DRAG: real vertical swipe across the canvas (UP), crosses touch-slop → detectDragGestures ──
- swipe:
    from:
      id: "rc-canvas"
    direction: UP
    duration: 600
    label: "drag → scroll content within the clip-window"

# ── Liveness / no-crash after the drag ──
- assertNotVisible:
    id: "rc-error"
    label: "Drag hat den Render-Pfad NICHT gecrasht"
- assertVisible:
    id: "rc-rendered"
    label: "Render committet weiter nach dem Drag"

# ── Co-signal (EXISTS today): rc-touch-echo moved off "0,0" → the drag reached the canvas on-device ──
- copyTextFrom:
    id: "rc-touch-echo"
- evalScript: ${output.echo1 = maestro.copiedText}
- assertTrue:
    condition: ${output.echo1 != output.echo0 && output.echo1 != "0,0"}
    label: "rc-touch-echo aenderte sich → Drag on-device akzeptiert + erreichte den Canvas (Input-Co-Signal)"

# ── PENDING CAUSAL GATE (needs rc-scroll-offset): the drag ADVANCED the scroll offset off the rest sentinel ──
#- copyTextFrom:
#    id: "rc-scroll-offset"
#- evalScript: ${output.off1 = maestro.copiedText}
#- assertTrue:
#    condition: ${output.off1 != output.off0 && output.off1 != "0.0"}
#    label: "drag advanced the ScrollModifier offset (KAUSAL — replaces the S3b visual clip-window-mad)"

# ── PENDING DETERMINISM PIN (§0): re-run with &live=0 → rc-scroll-offset MUST stay "0.0" ──
#   (static konsumiert keinen Touch → Scroll-Goldens immun. Heute teil-prüfbar via S3b live=0 clip-window
#    mad=0.000 + rc-touch-echo bleibt "0,0".)

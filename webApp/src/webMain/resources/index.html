<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KmpRemoteCompose</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- REM-161: canonical Compose-Multiplatform wasm container. ComposeViewport("composeApp") attaches its
         Skiko canvas to this full-size, (0,0)-origin div, so the canvas bounding-rect origin is the viewport

         body-attach + centered spinner-SVG sibling offset that origin → pointer events mis-mapped). -->
    <div id="composeApp"></div>
    <script type="application/javascript" src="webApp.js"></script>
</body>
